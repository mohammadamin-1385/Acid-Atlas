<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acid Atlas | مرجع اسیدها</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b10;
      --s1: #0f1520;
      --s2: #161e2b;
      --bd: #243044;
      --tx: #e7eef7;
      --mu: #8b9cb5;
      --dim: #5c6f88;
      --ac: #38bdf8;
      --font: 'Vazirmatn', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--tx); font-weight: 400; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    .topnav {
      height: 56px; display: flex; align-items: center; gap: 28px;
      padding: 0 24px; background: var(--s1); border-bottom: 1px solid var(--bd);
      position: sticky; top: 0; z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo {
      width: 34px; height: 34px; background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      color: #070b10; border-radius: 8px; display: grid; place-items: center;
      font-family: var(--mono); font-weight: 600; font-size: 13px;
    }
    .logo sup { font-size: 9px; }
    .brand-title { font-weight: 500; font-size: 15px; }
    .brand-sub { font-size: 10px; color: var(--dim); font-family: var(--mono); }
    .nav-links { display: flex; gap: 4px; }
    .nav-links button { padding: 7px 14px; border-radius: 6px; font-size: 13px; color: var(--mu); }
    .nav-links button:hover { color: var(--tx); background: var(--s2); }
    .nav-links button.active { background: var(--s2); color: var(--ac); }
    .top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; }
    .lang-btn {
      padding: 5px 12px; border: 1px solid var(--bd); border-radius: 6px;
      font-size: 12px; font-family: var(--mono); color: var(--ac);
    }
    .lang-btn:hover { border-color: var(--ac); }
    .count { font-size: 11px; color: var(--dim); font-family: var(--mono); }

    .main { flex: 1; padding: 24px; max-width: 1240px; width: 100%; margin: 0 auto; }
    .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .page-header h1 { font-size: 22px; font-weight: 500; }
    .subtitle { font-size: 13px; color: var(--mu); margin-top: 2px; }

    .stats-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat {
      background: var(--s1); border: 1px solid var(--bd); border-radius: 8px;
      padding: 10px 16px; display: flex; align-items: baseline; gap: 8px;
    }
    .stat-n { font-family: var(--mono); font-size: 18px; color: var(--ac); }
    .stat-l { font-size: 12px; color: var(--mu); }

    .filters {
      background: var(--s1); border: 1px solid var(--bd); border-radius: 10px;
      padding: 14px; margin-bottom: 18px;
    }
    .search-box input {
      width: 100%; background: var(--bg); border: 1px solid var(--bd); border-radius: 7px;
      padding: 10px 14px; font-size: 13px; outline: none; margin-bottom: 12px;
    }
    .search-box input:focus { border-color: var(--ac); }
    .filter-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .tabs { display: flex; gap: 5px; flex-wrap: wrap; }
    .tabs button {
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      background: var(--bg); border: 1px solid var(--bd); color: var(--mu);
    }
    .tabs button.on { background: var(--ac); color: #070b10; border-color: var(--ac); font-weight: 500; }
    .filter-right { display: flex; align-items: center; gap: 10px; }
    .filter-right select {
      background: var(--bg); border: 1px solid var(--bd); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; color: var(--mu);
    }
    .link { font-size: 12px; color: var(--mu); }
    .link:hover, .link.on { color: var(--ac); }
    .result-count { font-size: 12px; color: var(--dim); margin-top: 10px; }

    .content-grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .card {
      background: var(--s1); border: 1px solid var(--bd); border-radius: 10px;
      padding: 14px; cursor: pointer; transition: 0.15s;
    }
    .card:hover { border-color: #3b4d66; background: var(--s2); }
    .card.selected { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); }
    .card-top { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .id { font-family: var(--mono); font-size: 11px; color: var(--dim); }
    .star { font-size: 14px; color: var(--dim); }
    .star.on { color: #fbbf24; }
    .formula { font-family: var(--mono); font-size: 20px; color: var(--ac); margin-bottom: 4px; }
    .name { font-size: 13px; font-weight: 500; }
    .en { font-family: var(--mono); font-size: 11px; color: var(--mu); margin-bottom: 8px; }
    .tags { display: flex; gap: 5px; font-size: 11px; }
    .tags span { background: var(--bg); padding: 2px 7px; border-radius: 4px; color: var(--mu); }
    .tags .dim { color: var(--dim); }

    .empty {
      grid-column: 1/-1; text-align: center; padding: 48px; color: var(--mu);
      background: var(--s1); border: 1px dashed var(--bd); border-radius: 10px;
    }
    .empty .btn-primary { margin-top: 12px; }

    .detail {
      background: var(--s1); border: 1px solid var(--bd); border-radius: 12px;
      padding: 20px; position: sticky; top: 72px;
    }
    .detail-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--dim); margin-bottom: 14px; }
    .structure-box {
      background: var(--bg); border: 1px solid var(--bd); border-radius: 8px;
      padding: 14px; margin-bottom: 14px; text-align: center;
    }
    .mol-svg { width: 100%; max-width: 150px; height: auto; }
    .structure-label { font-size: 10px; color: var(--dim); margin-top: 6px; font-family: var(--mono); }
    .big-formula { font-family: var(--mono); font-size: 26px; color: var(--ac); margin-bottom: 6px; }
    .detail-name { font-size: 17px; font-weight: 500; margin-bottom: 2px; }
    .detail-en { font-family: var(--mono); font-size: 12px; color: var(--mu); margin-bottom: 10px; }
    .meta-row { display: flex; gap: 6px; margin-bottom: 14px; }
    .tag { font-size: 11px; background: var(--bg); border: 1px solid var(--bd); padding: 3px 8px; border-radius: 4px; color: var(--mu); }
    .tag.muted { color: var(--dim); }

    .props { margin-bottom: 14px; }
    .prop { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--bd); }
    .prop span { color: var(--mu); }
    .prop b { color: var(--ac); font-weight: 500; }

    .strength { margin-bottom: 14px; }
    .str-label { font-size: 11px; color: var(--mu); margin-bottom: 5px; }
    .bar-track { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #fbbf24, #34d399); border-radius: 3px; transition: width 0.3s; }
    .str-ends { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); margin-top: 3px; font-family: var(--mono); }

    .block { margin-bottom: 12px; }
    .block-t { font-size: 11px; color: var(--ac); margin-bottom: 3px; font-weight: 500; }
    .block p { font-size: 13px; color: var(--mu); line-height: 1.65; }
    .block.hazard .block-t { color: #f87171; }
    .note { font-size: 13px; color: var(--mu); line-height: 1.65; margin-bottom: 14px; }

    .actions { display: flex; gap: 6px; margin-bottom: 8px; }
    .actions button {
      flex: 1; padding: 8px; background: var(--bg); border: 1px solid var(--bd);
      border-radius: 6px; font-size: 12px; color: var(--mu);
    }
    .actions button:hover { border-color: var(--ac); color: var(--ac); }
    .btn-block {
      width: 100%; padding: 9px; background: var(--s2); border: 1px solid var(--bd);
      border-radius: 6px; font-size: 13px; margin-bottom: 6px; color: var(--tx);
    }
    .btn-block:hover { border-color: var(--ac); }
    .btn-block.accent { color: var(--ac); }
    .disclaimer { font-size: 11px; color: var(--dim); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--bd); line-height: 1.5; }

    .tool-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--bd); margin-bottom: 18px; }
    .tool-tabs button {
      padding: 10px 16px; font-size: 13px; color: var(--mu);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tool-tabs button.on { color: var(--ac); border-bottom-color: var(--ac); }
    .panel {
      background: var(--s1); border: 1px solid var(--bd); border-radius: 12px;
      padding: 24px; margin-bottom: 16px;
    }
    .panel h2 { font-size: 17px; font-weight: 500; margin-bottom: 12px; }
    .eq {
      background: var(--bg); border: 1px solid var(--bd); border-radius: 8px;
      padding: 12px 16px; font-family: var(--mono); font-size: 14px; color: var(--ac);
      margin-bottom: 18px; direction: ltr; text-align: left;
    }
    .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .inputs.single { grid-template-columns: 1fr; max-width: 320px; }
    .inputs label { font-size: 12px; color: var(--mu); display: block; }
    .inputs input {
      display: block; width: 100%; margin-top: 6px; background: var(--bg);
      border: 1px solid var(--bd); border-radius: 7px; padding: 10px 12px;
      font-size: 14px; font-family: var(--mono); color: var(--ac); outline: none; direction: ltr; text-align: left;
    }
    .inputs input:focus { border-color: var(--ac); }
    .mode-switch { display: flex; gap: 6px; margin-bottom: 14px; }
    .mode-switch button {
      padding: 7px 14px; border-radius: 6px; font-size: 12px;
      background: var(--bg); border: 1px solid var(--bd); color: var(--mu);
    }
    .mode-switch button.on { background: var(--ac); color: #070b10; border-color: var(--ac); font-weight: 500; }
    .results { background: var(--bg); border: 1px solid var(--bd); border-radius: 10px; overflow: hidden; }
    .main-result { padding: 18px; border-bottom: 1px solid var(--bd); }
    .main-result.wide { border-bottom: none; }
    .main-result span { display: block; font-size: 12px; color: var(--mu); margin-bottom: 4px; }
    .main-result strong { font-family: var(--mono); font-size: 26px; color: var(--ac); }
    .metrics { display: grid; grid-template-columns: repeat(3,1fr); padding: 14px 18px; gap: 12px; }
    .metrics span { display: block; font-size: 11px; color: var(--mu); margin-bottom: 3px; }
    .metrics b { font-family: var(--mono); font-size: 13px; }
    .warn {
      padding: 12px 16px; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25);
      border-radius: 8px; color: #fca5a5; font-size: 13px;
    }
    .hint { font-size: 12px; color: var(--dim); margin-top: 12px; }
    .science-note {
      font-size: 13px; color: var(--mu); background: var(--s1); border: 1px solid var(--bd);
      border-radius: 10px; padding: 14px 18px; line-height: 1.7;
    }

    .picker { background: var(--s1); border: 1px solid var(--bd); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
    .picker-title { font-size: 13px; color: var(--mu); margin-bottom: 12px; }
    .picker-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 6px;
      max-height: 280px; overflow-y: auto;
    }
    .picker-item {
      display: flex; flex-direction: column; align-items: flex-start; padding: 10px;
      background: var(--bg); border: 1px solid var(--bd); border-radius: 7px; text-align: start; transition: 0.15s;
    }
    .picker-item:hover { border-color: #3b4d66; }
    .picker-item.picked { border-color: var(--ac); background: rgba(56,189,248,0.06); }
    .pf { font-family: var(--mono); font-size: 14px; color: var(--ac); }
    .picker-item span:last-child { font-size: 11px; color: var(--mu); margin-top: 2px; }

    .comparison-result { background: var(--s1); border: 1px solid var(--bd); border-radius: 10px; padding: 20px; }
    .comparison-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .comp-col { background: var(--bg); border: 1px solid var(--bd); border-radius: 8px; padding: 16px; }
    .cf { font-family: var(--mono); font-size: 22px; color: var(--ac); margin-bottom: 6px; }
    .comp-col h3 { font-size: 15px; margin-bottom: 2px; }
    .ce { font-family: var(--mono); font-size: 11px; color: var(--mu); margin-bottom: 12px; }
    .crow { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-top: 1px solid var(--bd); }
    .crow span { color: var(--mu); }
    .comp-col p { font-size: 12px; color: var(--mu); margin-top: 10px; line-height: 1.6; }
    .conclusion {
      margin-top: 14px; padding: 12px 16px; background: rgba(56,189,248,0.06);
      border: 1px solid rgba(56,189,248,0.2); border-radius: 8px; font-size: 13px; color: var(--mu);
    }
    .conclusion strong { color: var(--ac); }
    .empty-compare {
      text-align: center; padding: 40px; color: var(--mu);
      background: var(--s1); border: 1px dashed var(--bd); border-radius: 10px;
    }

    .about-page { display: flex; align-items: center; justify-content: center; padding: 40px 20px; min-height: 70vh; }
    .about-card {
      background: var(--s1); border: 1px solid var(--bd); border-radius: 16px;
      padding: 40px; max-width: 420px; width: 100%; text-align: center;
    }
    .uni-logo { width: 80px; height: auto; margin-bottom: 14px; }
    .uni-name { font-size: 17px; font-weight: 500; margin-bottom: 4px; }
    .field { font-size: 13px; color: var(--mu); margin-bottom: 24px; }
    .divider { height: 1px; background: var(--bd); margin-bottom: 24px; }
    .person { margin-bottom: 22px; }
    .person .role { font-size: 11px; color: var(--ac); margin-bottom: 5px; letter-spacing: 0.5px; }
    .person .name { font-size: 18px; font-weight: 500; }
    .person .name-en { font-size: 13px; color: var(--mu); font-family: var(--mono); margin-top: 2px; }
    .person.student .name { font-size: 20px; }
    .year { font-size: 12px; color: var(--dim); margin: 20px 0 14px; font-family: var(--mono); }
    .thanks { font-size: 13px; color: var(--mu); line-height: 1.7; }

    .btn-primary {
      background: var(--ac); color: #070b10; padding: 9px 16px; border-radius: 7px;
      font-size: 13px; font-weight: 500;
    }
    .btn-out {
      border: 1px solid var(--bd); background: var(--s1); color: var(--mu);
      padding: 8px 14px; border-radius: 7px; font-size: 12px;
    }
    .btn-out:hover { border-color: var(--ac); color: var(--ac); }

    .footer {
      border-top: 1px solid var(--bd); padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--dim); font-family: var(--mono);
    }
    .sources { font-size: 10px; opacity: 0.85; }

    .toast {
      position: fixed; bottom: 24px; inset-inline-start: 24px; z-index: 100;
      background: #0c4a6e; border: 1px solid #0284c7; color: #e0f2fe;
      padding: 10px 18px; border-radius: 8px; font-size: 13px;
    }
    .toast-enter-active, .toast-leave-active { transition: 0.2s; }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateY(8px); }

    @media (max-width: 900px) {
      .content-grid { grid-template-columns: 1fr; }
      .detail { position: static; }
      .comparison-cols { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr; }
      .inputs { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .topnav { padding: 0 14px; gap: 12px; }
      .main { padding: 16px 14px; }
      .brand-sub { display: none; }
    }
  </style>
</head>

          let list = acids.filter(a => {
            const q = search.value.trim().toLowerCase()
            const catOk = activeCategory.value === 'همه' || a.group.fa === activeCategory.value
            const favOk = !showFavoritesOnly.value || favorites.value.includes(a.id)
            const searchOk = !q || [a.name.fa, a.name.en, a.formula, a.type.fa, a.type.en].some(v => String(v).toLowerCase().includes(q))
            return catOk && favOk && searchOk
          })
          if (sortBy.value === 'name') list.sort((a,b) => a.name.fa.localeCompare(b.name.fa, 'fa'))
          if (sortBy.value === 'name-en') list.sort((a,b) => a.name.en.localeCompare(b.name.en))
          if (sortBy.value === 'id') list.sort((a,b) => a.id - b.id)
          return list
        })

        const compareAcids = computed(() => compareIds.value.map(id => acids.find(a => a.id === id)).filter(Boolean))

        const acidCalc = computed(() => {
          const C = Number(concentration.value)
          const pKa = Number(pKaInput.value)
          if (!Number.isFinite(C) || !Number.isFinite(pKa) || C <= 0) return null
          const Ka = 10 ** (-pKa)
          const H = (-Ka + Math.sqrt(Ka*Ka + 4*Ka*C)) / 2
          if (!Number.isFinite(H) || H <= 0) return null
          return { Ka, H, pH: -Math.log10(H), ionization: (H/C)*100 }
        })

        const converted = computed(() => {
          const v = Number(convertValue.value)
          if (!Number.isFinite(v)) return null
          if (convertMode.value === 'pka-to-ka') return { label: 'Ka', value: 10 ** (-v) }
          if (v <= 0) return null
          return { label: 'pKa', value: -Math.log10(v) }
        })

        const comparisonText = computed(() => {
          const a = Number(comparePkaA.value)
          const b = Number(comparePkaB.value)
          if (!Number.isFinite(a) || !Number.isFinite(b)) return null
          if (a === b) return t.value.equal
          return a < b ? `${compareNameA.value} ${t.value.stronger}` : `${compareNameB.value} ${t.value.stronger}`
        })

          total: acids.length,
          mineral: acids.filter(a => a.group.fa === 'معدنی').length,
          organic: acids.filter(a => a.group.fa === 'آلی').length,
          strength: acids.filter(a => a.group.fa === 'قدرت اسیدی').length
        }))

        function notify(msg) {
          toast.value = msg
          clearTimeout(notify._t)
          notify._t = setTimeout(() => toast.value = '', 2200)
        }

        function selectAcid(a) {
          selectedId.value = a.id
          page.value = 'library'
        }

        function toggleFavorite(id) {
          const has = favorites.value.includes(id)
          favorites.value = has ? favorites.value.filter(x => x !== id) : [...favorites.value, id]
          notify(has ? t.value.removedFav : t.value.addedFav)
        }

        function toggleCompare(id) {
          if (compareIds.value.includes(id)) {
            compareIds.value = compareIds.value.filter(x => x !== id)
            return
          }
          if (compareIds.value.length >= 2) {
            notify(t.value.onlyTwo)
            return
          }
          compareIds.value = [...compareIds.value, id]
        }

        async function copyFormula(f) {
          try {
            await navigator.clipboard.writeText(f)
            notify(t.value.copied)
          } catch {
            notify('Copy not available')
          }
        }

        function exportCsv() {
          const rows = [
            ['id','name_fa','name_en','formula','group','type','pKa'],
            ...filteredAcids.value.map(a => [a.id, a.name.fa, a.name.en, a.formula, a.group.fa, a.type.fa, a.pka ?? ''])
          ]
          const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replaceAll('"','""')}"`).join(',')).join('\n')
          const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'})
          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = 'acid-atlas.csv'
          a.click()
          URL.revokeObjectURL(url)
          notify(t.value.csvSaved)
        }

        function resetFilters() {
          search.value = ''
          activeCategory.value = 'همه'
          showFavoritesOnly.value = false
          sortBy.value = 'id'
        }

          }

        }

        }

          lang.value = lang.value === 'fa' ? 'en' : 'fa'
        }

          try { localStorage.setItem('acid-atlas-fav', JSON.stringify(v)) } catch {}
        }, { deep: true })

        try {
          favorites.value = JSON.parse(localStorage.getItem('acid-atlas-fav') || '[]')
        } catch { favorites.value = [] }

        return {

          selectedId, showFavoritesOnly, favorites, compareIds, toast,
          concentration, pKaInput, convertMode, convertValue,
          comparePkaA, comparePkaB, compareNameA, compareNameB,

      `
    }).mount('#app')
